<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Free Binary Tools - Professional, client-side tools for Binary, HEX, ASCII, and Decimal conversion. All 100% free and secure.">
    <title>Binary Tools Suite | TOOLSHUB.COM</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@700;800&display=swap"
        rel="stylesheet">

    <!-- Styles -->
    <!-- Global CSS -->
    <link rel="stylesheet" href="../image-tools/css/global.css">
    <link rel="stylesheet" href="../image-tools/css/components.css">
    <link rel="stylesheet" href="../image-tools/css/responsive.css">
    <link rel="stylesheet" href="../image-tools/css/tool-page.css">

    <style>
        .category-hero {
            background: var(--color-binary);
            color: white;
            padding: 4rem 2rem;
            text-align: center;
            border-radius: var(--radius-xl);
            margin-bottom: 3rem;
            box-shadow: var(--shadow-lg);
        }

        .category-hero h1 {
            font-family: var(--font-heading);
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .category-hero p {
            font-size: 1.2rem;
            opacity: 0.9;
            max-width: 800px;
            margin: 0 auto;
        }

        .tools-section {
            margin-bottom: 4rem;
        }

        .tools-section-title {
            font-family: var(--font-heading);
            font-size: 2rem;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            color: var(--text-primary);
        }

        .tool-card.binary .tool-icon {
            background: rgba(96, 125, 139, 0.1);
            color: var(--color-binary);
        }

        .tool-card.binary:hover .tool-icon {
            background: var(--color-binary);
            color: white;
        }
    </style>
</head>

<body class="category-page">
    <!-- Header injected by shared script -->


    <main class="container" style="margin-top: 120px;">
        <!-- Breadcrumb will be injected here by shared script -->

        <section class="category-hero" style="margin-bottom: 4rem;">
            <h1 style="font-size: 4rem; font-weight: 800; margin-bottom: 1.5rem;">Binary Conversion Suite</h1>
            <p style="font-size: 1.4rem; opacity: 0.9; max-width: 900px; margin: 0 auto;">14 professional-grade
                conversion tools for Binary, Hexadecimal, Decimal, and ASCII. Fast, secure, and 100% client-side
                processing.</p>
        </section>

        <section class="tools-section" style="margin-top: 5rem;">
            <h2 class="tools-section-title">🚀 Featured Converters</h2>
            <div class="tools-grid" id="featured-tools">
                <!-- Populated by JS -->
            </div>
        </section>

        <section class="tools-section" style="margin-top: 5rem;">
            <h2 class="tools-section-title">🔢 All Binary Tools</h2>
            <div class="tools-grid" id="all-tools">
                <!-- Populated by JS -->
            </div>
        </section>
    </main>

    <!-- Footer injected by shared script -->

    <script src="../scripts/tools-data.js"></script>
    <script src="../image-tools/js/shared/theme.js"></script>
    <script src="../image-tools/js/shared/header.js"></script>
    <script src="../image-tools/js/shared/breadcrumb.js"></script>
    <script src="../image-tools/js/shared/footer.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const binaryTools = TOOLS_DATA.binaryTools.tools;
            const featuredGrid = document.getElementById('featured-tools');
            const allGrid = document.getElementById('all-tools');

            binaryTools.forEach((tool, index) => {
                const card = document.createElement('a');
                card.href = tool.url.replace('binary-tools/', ''); // Since we are already in the directory
                card.className = 'tool-card binary';
                card.innerHTML = `
                    <div class="tool-icon">ðŸ”¢</div>
                    <h3 class="tool-name">${tool.name}</h3>
                    <p class="tool-desc">${tool.desc}</p>
                    ${index < 4 ? '<span class="tool-badge">Popular</span>' : ''}
                `;

                if (index < 4) {
                    featuredGrid.appendChild(card.cloneNode(true));
                }
                allGrid.appendChild(card);
            });
        });
    </script>
</body>

</html>
